name: Development Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/development-release.yml' # Detects changes to this workflow file itself
      - 'composeApp/**'
      - 'server/**'
      - '*.gradle.kts'
      - '*.properties'
      - 'gradle/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. First, detect which part of the code changed
  check_changes:
    name: Check Changed Paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - '.github/workflows/development-release.yml'
              - 'composeApp/**'
              - '*.gradle.kts'
              - '*.properties'
              - 'gradle/**'
            server:
              - '.github/workflows/development-release.yml'
              - 'server/**'
              - '*.gradle.kts'
              - '*.properties'
              - 'gradle/**'

  # 2. Always run Version Code increase if the workflow triggered
  increase_version_code:
    name: Increase Version Code
    needs: check_changes
    runs-on: ubuntu-latest
    if: ${{ needs.check_changes.outputs.app == 'true' || needs.check_changes.outputs.server == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # Note: v5 is not released yet, defaulted to v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7 # Updated to v5 (latest stable)
        with:
          python-version: '3.10'

      - name: Increase version code
        id: increase_version_code
        run: python ./scripts/increaseVersionCode.py

      - name: Commit modified files
        id: commit_files
        uses: stefanzweifel/git-auto-commit-action@v7 # Updated to v5 (latest stable)
        with:
          commit_message: 'Updated Version Code'
          file_pattern: 'version.properties iosApp/iosApp/Info.plist'
          branch: master

  run_shared_tests:
    name: Run shared tests
    needs: [ increase_version_code, check_changes ]
    # Run if 'server' filter matched
    if: ${{ needs.check_changes.outputs.server == 'true' || needs.check_changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Run Shared Tests
        id: shared_tests
        run: ./gradlew :shared:check

      - name: Upload test results (on failure)
        if: ${{ steps.shared_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-results
          retention-days: 3
          path: |
            shared/build/test-results
            shared/build/reports/tests

  run_app_tests:
    name: Run app tests
    needs: [ increase_version_code, check_changes ]
    # Run if 'server' filter matched
    if: ${{ needs.check_changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Copy dummy google-services.json
        run: |
          cp android/google-services.test.json android/google-services.json

      - name: Run App Tests
        id: app_tests
        run: ./gradlew :composeApp:check

      - name: Upload test results (on failure)
        if: ${{ steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          retention-days: 3
          path: |
            composeApp/build/test-results
            composeApp/build/reports/tests

  run_ios_tests:
    name: Run iOS app tests
    needs: [ increase_version_code, check_changes ]
    if: ${{ needs.check_changes.outputs.app == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
      - uses: gradle/actions/setup-gradle@v6
      - name: Copy dummy google-services.json
        run: cp android/google-services.test.json android/google-services.json
      - name: Run iOS tests
        uses: ./.github/actions/run-ios-tests

  # 3. Android Jobs (Only runs if app files changed)
  publish_internal_release:
    name: Android - Publish Internal Release
    runs-on: ubuntu-latest

    needs: [run_shared_tests, run_app_tests]
    # Inherits the conditional logic from run_shared_tests automatically because of 'needs'
    # but strictly checking is good practice:
    if: ${{ always() && needs.run_shared_tests.result == 'success' && needs.run_app_tests.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Determine In-App Update Priority
        id: determine_priority
        uses: actions/github-script@v9
        with:
          script: |
            let priority = 2;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            
            if (prs.length > 0) {
              const pr = prs[0];
              const labels = pr.labels.map(label => label.name);
              console.log(`Found PR #${pr.number} with labels: ${labels.join(', ')}`);
            
              const highPriorityLabels = ['migration', 'important', 'security'];
              if (labels.some(l => highPriorityLabels.includes(l))) {
                priority = 4;
              } else if (labels.includes('app')) {
                priority = 3;
              }
            } else {
              console.log('Direct push. Using default priority.');
            }
            console.log(`Setting inAppUpdatePriority to: ${priority}`);
            core.setOutput('priority', priority);

      - name: Decode Keystore
        run: |
          echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} > keystore.txt
          base64 --decode keystore.txt > keystore.jks
      - name: Verify Keystore integrity
        env:
          KEYSTORE_SHA256: 6268f9f99a68ab7903a342290ff1762c5ffdebd0fa467d3176c6dac2e0cdde7f
        run: |
          echo "${{ env.KEYSTORE_SHA256 }} keystore.jks" | sha256sum --check --status || exit 1
      - name: Verify Keystore contents
        run: |
          keytool -list -v -keystore keystore.jks -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Decode google-services.json
        run: |
          echo ${{ secrets.GOOGLE_SERVICES_BASE64 }} > google-services.txt
          base64 --decode google-services.txt > android/google-services.json
      - name: Verify google-services.json integrity
        env:
          KEYSTORE_SHA256: 231998efc417aa76bf3de171964df690f52b830b6489b5bb882a1156237e742e
        run: |
          cd android
          echo "${{ env.KEYSTORE_SHA256 }} google-services.json" | sha256sum --check --status || exit 1

      - name: Clean quote backslashes
        id: clean_backslash
        run: bash ./scripts/clean-backslash.sh

      # Set up Sentry UUIDs and create properties file
      - name: Sentry - Generate UUIDs
        id: uuids
        run: |
          echo "source_uuid=$(uuidgen)" >> $GITHUB_OUTPUT
          echo "proguard_uuid=$(uuidgen)" >> $GITHUB_OUTPUT
      - name: Sentry - Create Properties File
        run: |
          # Define the target path
          ASSETS_DIR="composeApp/src/androidMain/assets"
          mkdir -p $ASSETS_DIR
          
          # Write the properties file
          echo "io.sentry.bundle-ids=${{ steps.uuids.outputs.source_uuid }}" > $ASSETS_DIR/sentry-debug-meta.properties
          echo "io.sentry.ProguardUuids=${{ steps.uuids.outputs.proguard_uuid }}" >> $ASSETS_DIR/sentry-debug-meta.properties
          
          cat $ASSETS_DIR/sentry-debug-meta.properties

      - name: Build AAB
        id: build_aab
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew :android:bundleRelease

      - name: AAB Artifact
        id: aab_artifact
        uses: actions/upload-artifact@v7
        with:
          name: AAB Artifact
          path: ./android/build/outputs/bundle/release/android-release.aab

      - name: Sentry - Install CLI
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
      - name: Sentry - Upload Source Bundle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Simulate Android source structure for Sentry
          mkdir -p build/sentry-sources
          cp -R composeApp/src/commonMain/kotlin/. build/sentry-sources/
          cp -R composeApp/src/androidMain/kotlin/. build/sentry-sources/

          sentry-cli debug-files bundle-jvm --output bundle --debug-id ${{ steps.uuids.outputs.source_uuid }} build/sentry-sources/ --org ${{ secrets.SENTRY_ORG }} --project ${{ secrets.SENTRY_PROJECT }}
          sentry-cli debug-files upload --type jvm bundle/${{ steps.uuids.outputs.source_uuid }}.zip --org ${{ secrets.SENTRY_ORG }} --project ${{ secrets.SENTRY_PROJECT }}
      - name: Sentry - Upload ProGuard Mapping
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          sentry-cli upload-proguard \
            --uuid ${{ steps.uuids.outputs.proguard_uuid }} \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_PROJECT }} \
            android/build/outputs/mapping/release/mapping.txt

      - name: Upload to Play Store
        id: upload_play_store
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_GOOGLE_CLOUD_JSON }}
          packageName: org.centrexcursionistalcoi.app
          releaseFiles: ./android/build/outputs/bundle/release/android-release.aab
          track: "internal"
          inAppUpdatePriority: ${{ steps.determine_priority.outputs.priority }}
          status: completed

  sentry_android:
    name: Release Android to Sentry
    runs-on: ubuntu-latest

    needs: publish_internal_release

    steps:
      - uses: actions/checkout@v7
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "release=$VERSION_NAME-$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Create Sentry release - Android
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: app-android
        with:
          environment: development
          version: ${{ steps.version.outputs.release }}

  # iOS - mirrors publish_internal_release above: every push to master that touches app code
  # gets built and pushed straight to TestFlight, same as Android's "internal" track.
  publish_ios_testflight:
    name: iOS - Publish Bleeding-edge to TestFlight
    runs-on: [self-hosted, macOS, ARM64]

    needs: [run_shared_tests, run_app_tests, run_ios_tests]
    # Inherits the conditional logic from run_shared_tests/run_app_tests automatically because
    # of 'needs', but strictly checking is good practice:
    if: ${{ always() && needs.run_shared_tests.result == 'success' && needs.run_app_tests.result == 'success' && needs.run_ios_tests.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      # iosApp/KotlinMultiplatformLinkedPackage is a Kotlin/Native Swift Export synthetic package
      # checked into git. It must exactly match what the Kotlin Gradle plugin regenerates from the
      # current dependency graph, or Xcode aborts mid-archive with "Synthetic linkage package
      # files changed during the build" (see #610). Regenerating and re-syncing it here, before
      # dependency resolution, means a drifted checked-in copy (e.g. after bumping a dependency
      # with a native/subpackage shim) gets fixed and committed automatically instead of breaking
      # the archive (see #612).
      - name: Sync KotlinMultiplatformLinkedPackage with current dependencies
        run: |
          ./gradlew :composeApp:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage || true
          rsync -a --delete --exclude='.swiftpm' composeApp/build/kotlin/swiftImport/ iosApp/KotlinMultiplatformLinkedPackage/

      - name: Commit synced KotlinMultiplatformLinkedPackage
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Sync KotlinMultiplatformLinkedPackage with current dependency graph'
          file_pattern: 'iosApp/KotlinMultiplatformLinkedPackage'
          branch: master

      # --- Install Signing Assets ---
      - name: Install Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create GoogleService.plist
        env:
          GOOGLE_SERVICE_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_PLIST_BASE64 }}
        run: |
          rm iosApp/iosApp/GoogleService-Info.plist
          printf '%s\n' "$GOOGLE_SERVICE_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
      - name: Verify GoogleService-Info.plist integrity
        env:
          GOOGLE_SERVICE_INFO_SHA256: 2dffdbd64e2c8d027a2b3f51199afa60f1a6414e5bac4ead873674f6490ddcd6
        run: |
          cd iosApp/iosApp
          echo "${{ env.GOOGLE_SERVICE_INFO_SHA256 }}  GoogleService-Info.plist" | shasum -a 256 -c -

      # Xcode's package resolution can otherwise race with the "Compile Kotlin Framework" build phase during
      # archive (the phase can start before packages are fully resolved), so run it as its own upfront step.
      - name: Resolve SwiftPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -workspace iosApp/iosApp.xcworkspace -scheme iosApp

      - name: Archive iOS App
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="CEA App" \
            DEVELOPMENT_TEAM="UQSVPP37UL" \
            clean archive

      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: "UQSVPP37UL"
          BUNDLE_ID: "org.centrexcursionistalcoi.app"
          PROFILE_NAME: "CEA App"
        run: |
          cat <<EOF > iosApp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/iosApp.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath $PWD/build/output

      - name: IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPA Artifact
          path: build/output/*.ipa

      # --- Upload to App Store Connect (TestFlight) ---
      - name: Upload to App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APP_STORE_CONNECT_APP_APPLE_ID }}
        run: |
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "Error: No IPA file found in build/output"
            exit 1
          fi

          echo "Found IPA at: $IPA_PATH"

          APP_PLIST_ENTRY=$(unzip -Z1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -n 1)
          unzip -p "$IPA_PATH" "$APP_PLIST_ENTRY" > "$RUNNER_TEMP/app-info.plist"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_TEMP/app-info.plist")
          BUNDLE_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/app-info.plist")
          echo "Bundle version: $BUNDLE_VERSION ($BUNDLE_SHORT_VERSION)"

          mkdir -p ~/.private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_$API_KEY_ID.p8

          echo "Uploading to App Store Connect..."
          xcrun altool --upload-package "$IPA_PATH" \
            --type ios \
            --apple-id "$APPLE_ID" \
            --bundle-id "org.centrexcursionistalcoi.app" \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_SHORT_VERSION" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # sentry-cli is installed globally on the self-hosted runner (not per-run like the Android job's
      # ubuntu-latest one below): the installer's default sudo-to-/usr/local/bin install fails in a
      # non-interactive shell ("sudo: a password is required"), and there's no need to reinstall it on every
      # run anyway on a machine that persists between jobs.
      - name: Sentry - Upload iOS Debug Files (dSYMs & Source)
        run: |
          DSYM_PATH="$PWD/build/iosApp.xcarchive/dSYMs"

          sentry-cli debug-files upload \
            --include-sources \
            --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_PROJECT }} \
            "$DSYM_PATH"

      # https://docs.sentry.io/platforms/apple/guides/ios/size-analysis/ -- master-branch size history only (see
      # the equivalent comment on :android's `sentry { sizeAnalysis { ... } }` block): no base_sha is set here,
      # since there's no PR-triggered build to compare against yet.
      - name: Sentry - Upload Size Analysis
        run: |
          sentry-cli build upload "$PWD/build/iosApp.xcarchive" \
            --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} \
            --org ${{ secrets.SENTRY_ORG }} \
            --project app-ios \
            --build-configuration Release \
            --head-sha "${{ github.sha }}" \
            --head-ref "${{ github.ref_name }}" \
            --head-repo-name "${{ github.repository }}" \
            --vcs-provider github

      # This runner is self-hosted and persists between jobs, unlike GitHub-hosted runners.
      # "security create-keychain" above adds this job's temp keychain to the user's login
      # keychain search list; without deleting it here, every run leaves behind a dangling
      # entry pointing at a file that $RUNNER_TEMP already cleaned up.
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  sentry_ios:
    name: Release iOS to Sentry
    runs-on: ubuntu-latest

    needs: publish_ios_testflight

    steps:
      - uses: actions/checkout@v7
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2)
          echo "release=$VERSION_NAME-$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Create Sentry release - iOS
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: app-ios
        with:
          environment: development
          version: ${{ steps.version.outputs.release }}

  # 4. Server Jobs (Only runs if server files changed)
  run_server_tests:
    name: Run server tests
    needs: [increase_version_code, check_changes]
    # Run if 'server' filter matched
    if: ${{ needs.check_changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Set Docker API version
        run: echo api.version=1.44 >> ~/.docker-java.properties

      - name: Run Server Tests
        id: server_tests
        run: ./gradlew :server:check

  publish_docker_image:
    name: Build and Publish Docker image
    runs-on: ubuntu-latest
    needs: [ run_server_tests, run_shared_tests ]
    # Inherits the conditional logic from run_server_tests and run_shared_tests automatically
    # because of 'needs' but strictly checking is good practice:
    if: ${{ always() && needs.run_server_tests.result == 'success' && needs.run_shared_tests.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push development
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: arnyminerz/cea-app:development
          file: server/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  sentry_server:
    name: Release Server to Sentry
    runs-on: ubuntu-latest

    needs: publish_docker_image

    steps:
      - uses: actions/checkout@v7
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)
          echo "release=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Create Sentry release - Server
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: server
        with:
          environment: development
          version: ${{ steps.version.outputs.release }}
