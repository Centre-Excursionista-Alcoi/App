name: Release Binaries

on:
  release:
    types:
      - released
      - prereleased

jobs:
  update-version-name:
    name: Update version name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Update version name
        run: |
          # The GitHub release name can carry a pre-release suffix (e.g. "2.0.31-rc03") to distinguish it in
          # the GitHub UI/Sentry/etc., but updateVersionName.py (and the Android/iOS version fields it writes)
          # only accepts 1-3 dot-separated integers -- trim anything from the first non-numeric character on.
          VERSION_NAME=$(echo "${{ github.event.release.name }}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}')
          python ./scripts/updateVersionName.py --name="$VERSION_NAME"

      - name: Increase version code
        id: increase_version_code
        run: python ./scripts/increaseVersionCode.py

      - name: Commit modified version code file
        id: commit_version_code
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Updated Version'
          file_pattern: 'version.properties iosApp/iosApp.xcodeproj/project.pbxproj iosApp/iosApp/Info.plist'
          branch: master

  shared-tests:
    name: Run shared tests
    runs-on: ubuntu-latest

    needs: [ update-version-name ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Run Shared Tests
        id: shared_tests
        run: ./gradlew :shared:check

      - name: Upload test results (on failure)
        if: ${{ steps.shared_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: shared-test-results
          retention-days: 3
          path: |
            shared/build/test-results
            shared/build/reports/tests

  app-tests:
    name: Run app tests
    runs-on: ubuntu-latest

    needs: [ update-version-name ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Copy dummy google-services.json
        run: |
          cp android/google-services.test.json android/google-services.json

      - name: Run App Tests
        id: app_tests
        run: ./gradlew :composeApp:check

      - name: Upload test results (on failure)
        if: ${{ steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          retention-days: 3
          path: |
            composeApp/build/test-results
            composeApp/build/reports/tests

  ios-tests:
    name: Run iOS app tests
    runs-on: [self-hosted, macOS, ARM64]
    needs: [ update-version-name ]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk
      - uses: gradle/actions/setup-gradle@v6
      - name: Copy dummy google-services.json
        run: cp android/google-services.test.json android/google-services.json
      - name: Run iOS tests
        uses: ./.github/actions/run-ios-tests

  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    needs: [shared-tests, app-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      # Refresh the version name again just in case
      - name: Update version name
        run: |
          # The GitHub release name can carry a pre-release suffix (e.g. "2.0.31-rc03") to distinguish it in
          # the GitHub UI/Sentry/etc., but updateVersionName.py (and the Android/iOS version fields it writes)
          # only accepts 1-3 dot-separated integers -- trim anything from the first non-numeric character on.
          VERSION_NAME=$(echo "${{ github.event.release.name }}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}')
          python ./scripts/updateVersionName.py --name="$VERSION_NAME"

      - name: Determine In-App Update Priority
        id: determine_priority
        uses: actions/github-script@v9
        with:
          script: |
            let priority = 2;
            const currentVersion = context.payload.release.name;
            const currentTag = context.payload.release.tag_name;
            
            console.log(`Current Version Name: ${currentVersion}`);
            
            // 1. Check Version Increment (Major vs Minor)
            try {
              // Fetch recent releases to find the previous one
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 10
              });
            
              // Filter out the current release and any drafts/prereleases to find the "previous" stable release
              const sortedReleases = releases.data
                .filter(r => !r.draft && !r.prerelease && r.tag_name !== currentTag)
                .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
            
              if (sortedReleases.length > 0) {
                const previousVersion = sortedReleases[0].name;
                console.log(`Previous Version: ${previousVersion}`);
            
                // Simple regex to extract Major.Minor
                const versionRegex = /^v?(\d+)\.(\d+)/;
                const currentMatch = currentVersion.match(versionRegex);
                const prevMatch = previousVersion.match(versionRegex);
            
                if (currentMatch && prevMatch) {
                  const currMajor = parseInt(currentMatch[1]);
                  const currMinor = parseInt(currentMatch[2]);
                  const prevMajor = parseInt(prevMatch[1]);
                  const prevMinor = parseInt(prevMatch[2]);
            
                  if (currMajor > prevMajor) {
                    priority = 4;
                    console.log("Major version increase detected. Setting priority to 4.");
                  } else if (currMinor > prevMinor) {
                    priority = 3;
                    console.log("Minor version increase detected. Setting priority to 3.");
                  }
                }
              } else {
                console.log("No previous release found to compare versions.");
              }
            } catch (err) {
              console.log("Error checking version history: " + err);
            }
            
            // 2. Check PR Labels (Only if priority is not already maxed out at 4)
            if (priority < 4) {
              try {
                // Get PRs associated with the release commit/tag
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                });
            
                const highPriorityLabels = ['migration', 'important', 'security'];
            
                for (const pr of prs) {
                  const labels = pr.labels.map(l => l.name);
                  console.log(`Checking PR #${pr.number} labels: ${labels.join(', ')}`);
            
                  if (labels.some(l => highPriorityLabels.includes(l))) {
                    priority = 4;
                    console.log("High priority label found. Elevating priority to 4.");
                    break; // Efficiency: Don't check rest if max priority reached
                  } else if (labels.includes('app')) {
                    // Only upgrade to 3 if we are at 2. If we are already at 3 (due to minor version), stay at 3.
                    if (priority < 3) {
                      priority = 3;
                      console.log("'app' label found. Elevating priority to 3.");
                    }
                  }
                }
              } catch (err) {
                console.log("Error checking PR labels: " + err);
              }
            }
            
            console.log(`Final Calculated Priority: ${priority}`);
            core.setOutput('priority', priority);

      - name: Clean quote backslashes
        id: clean_backslash
        run: bash ./scripts/clean-backslash.sh

      - name: Decode Keystore
        run: |
          echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} > keystore.txt
          base64 --decode keystore.txt > keystore.jks
      - name: Verify Keystore integrity
        env:
          KEYSTORE_SHA256: 6268f9f99a68ab7903a342290ff1762c5ffdebd0fa467d3176c6dac2e0cdde7f
        run: |
          echo "${{ env.KEYSTORE_SHA256 }} keystore.jks" | sha256sum --check --status || exit 1
      - name: Verify Keystore contents
        run: |
          keytool -list -v -keystore keystore.jks -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Decode google-services.json
        run: |
          echo ${{ secrets.GOOGLE_SERVICES_BASE64 }} > google-services.txt
          base64 --decode google-services.txt > android/google-services.json
      - name: Verify google-services.json integrity
        env:
          KEYSTORE_SHA256: 231998efc417aa76bf3de171964df690f52b830b6489b5bb882a1156237e742e
        run: |
          cd android
          echo "${{ env.KEYSTORE_SHA256 }} google-services.json" | sha256sum --check --status || exit 1

      # Set up Sentry UUIDs and create properties file
      - name: Sentry - Generate UUIDs
        id: uuids
        run: |
          echo "source_uuid=$(uuidgen)" >> $GITHUB_OUTPUT
          echo "proguard_uuid=$(uuidgen)" >> $GITHUB_OUTPUT
      - name: Sentry - Create Properties File
        run: |
          # Define the target path
          ASSETS_DIR="composeApp/src/androidMain/assets"
          mkdir -p $ASSETS_DIR
          
          # Write the properties file
          echo "io.sentry.bundle-ids=${{ steps.uuids.outputs.source_uuid }}" > $ASSETS_DIR/sentry-debug-meta.properties
          echo "io.sentry.ProguardUuids=${{ steps.uuids.outputs.proguard_uuid }}" >> $ASSETS_DIR/sentry-debug-meta.properties
          
          cat $ASSETS_DIR/sentry-debug-meta.properties

      - name: Build AAB
        id: build_aab
        env:
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PRODUCTION: true
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew :android:bundleRelease :android:assembleRelease

      - name: Sentry - Install CLI
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
      - name: Sentry - Upload Source Bundle
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Simulate Android source structure for Sentry
          mkdir -p build/sentry-sources
          cp -R composeApp/src/commonMain/kotlin/. build/sentry-sources/
          cp -R composeApp/src/androidMain/kotlin/. build/sentry-sources/

          sentry-cli debug-files bundle-jvm --output bundle --debug-id ${{ steps.uuids.outputs.source_uuid }} build/sentry-sources/ --org ${{ secrets.SENTRY_ORG }} --project ${{ secrets.SENTRY_PROJECT }}
          sentry-cli debug-files upload --type jvm bundle/${{ steps.uuids.outputs.source_uuid }}.zip --org ${{ secrets.SENTRY_ORG }} --project ${{ secrets.SENTRY_PROJECT }}
      - name: Sentry - Upload ProGuard Mapping
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          sentry-cli upload-proguard \
            --uuid ${{ steps.uuids.outputs.proguard_uuid }} \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_PROJECT }} \
            android/build/outputs/mapping/release/mapping.txt

      - name: Release AAB & APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./android/build/outputs/**/*.apk

      - name: Upload to Play Store
        id: upload_play_store
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_GOOGLE_CLOUD_JSON }}
          packageName: org.centrexcursionistalcoi.app
          releaseFiles: ./android/build/outputs/bundle/release/android-release.aab
          # GitHub pre-releases stay on the open-testing "beta" track; a full "released" GitHub release now
          # actually rolls out to Play Store's "production" track for the first time -- previously every
          # release.yml run (there was no pre-release trigger at all) went to "beta" regardless.
          track: ${{ github.event.release.prerelease && 'beta' || 'production' }}
          # Priority is dynamically set by the previous script step
          inAppUpdatePriority: ${{ steps.determine_priority.outputs.priority }}
          status: completed

  sentry-android:
    name: Release Android to Sentry
    runs-on: ubuntu-latest

    needs: build-android

    steps:
      - uses: actions/checkout@v7
      - name: Create Sentry release - Android
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: app-android
        with:
          environment: ${{ github.event.release.prerelease && 'beta' || 'production' }}
          version: ${{ github.event.release.name }}

  build-ios:
    name: Build for iOS
    runs-on: [self-hosted, macOS, ARM64]

    needs: [shared-tests, app-tests, ios-tests]

    steps:
      - uses: actions/checkout@v7

      # --- Setup Environment ---
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      # iosApp/KotlinMultiplatformLinkedPackage is a Kotlin/Native Swift Export synthetic package
      # checked into git. It must exactly match what the Kotlin Gradle plugin regenerates from the
      # current dependency graph, or Xcode aborts mid-archive with "Synthetic linkage package
      # files changed during the build" (see #610). Regenerating and re-syncing it here, before
      # dependency resolution, means a drifted checked-in copy (e.g. after bumping a dependency
      # with a native/subpackage shim) gets fixed and committed automatically instead of breaking
      # the archive (see #612).
      - name: Sync KotlinMultiplatformLinkedPackage with current dependencies
        run: |
          ./gradlew :composeApp:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage || true
          rsync -a --delete --exclude='.swiftpm' composeApp/build/kotlin/swiftImport/ iosApp/KotlinMultiplatformLinkedPackage/

      - name: Commit synced KotlinMultiplatformLinkedPackage
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Sync KotlinMultiplatformLinkedPackage with current dependency graph'
          file_pattern: 'iosApp/KotlinMultiplatformLinkedPackage'
          branch: master

      # Refresh the version name again just in case
      - name: Update version name
        run: |
          # The GitHub release name can carry a pre-release suffix (e.g. "2.0.31-rc03") to distinguish it in
          # the GitHub UI/Sentry/etc., but updateVersionName.py (and the Android/iOS version fields it writes)
          # only accepts 1-3 dot-separated integers -- trim anything from the first non-numeric character on.
          VERSION_NAME=$(echo "${{ github.event.release.name }}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}')
          python ./scripts/updateVersionName.py --name="$VERSION_NAME"

      # --- Install Signing Assets ---
      - name: Install Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create GoogleService.plist
        env:
          GOOGLE_SERVICE_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_PLIST_BASE64 }}
        run: |
          rm iosApp/iosApp/GoogleService-Info.plist
          printf '%s\n' "$GOOGLE_SERVICE_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
      - name: Verify GoogleService-Info.plist integrity
        env:
          GOOGLE_SERVICE_INFO_SHA256: 2dffdbd64e2c8d027a2b3f51199afa60f1a6414e5bac4ead873674f6490ddcd6
        run: |
          cd iosApp/iosApp
          echo "${{ env.GOOGLE_SERVICE_INFO_SHA256 }}  GoogleService-Info.plist" | shasum -a 256 -c -

      # Xcode's package resolution can otherwise race with the "Compile Kotlin Framework" build phase during
      # archive (the phase can start before packages are fully resolved), so run it as its own upfront step.
      - name: Resolve SwiftPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -workspace iosApp/iosApp.xcworkspace -scheme iosApp

      - name: Archive iOS App
        env:
          # Without this, BuildKonfig.DEBUG defaults to true (see composeApp/build.gradle.kts), so the
          # published App Store build would report environment: "development" to Sentry instead of
          # "production" -- matching the PRODUCTION=true already set for the Android/Desktop release builds.
          PRODUCTION: true
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="CEA App" \
            DEVELOPMENT_TEAM="UQSVPP37UL" \
            clean archive

      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: "UQSVPP37UL"
          BUNDLE_ID: "org.centrexcursionistalcoi.app"
          PROFILE_NAME: "CEA App"
        run: |
          cat <<EOF > iosApp/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
          
              <key>teamID</key>
              <string>$TEAM_ID</string>
          
              <key>signingStyle</key>
              <string>manual</string>
          
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/iosApp.xcarchive \
            -exportOptionsPlist iosApp/ExportOptions.plist \
            -exportPath $PWD/build/output

      - name: IPA Artifact
        id: aab_artifact
        uses: actions/upload-artifact@v7
        with:
          name: IPA Artifact
          path: build/output/*.ipa

      # --- Upload to App Store Connect ---
      - name: Upload to App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APP_STORE_CONNECT_APP_APPLE_ID }}
        run: |
          # 1. Debug: Print what files were actually exported
          echo "Listing exported files:"
          ls -R build/output

          # 2. Find the IPA file path dynamically
          # This looks inside build/output for any file ending in .ipa
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "Error: No IPA file found in build/output"
            exit 1
          fi

          echo "Found IPA at: $IPA_PATH"

          # altool's --upload-package needs the exact bundle version/short version of the
          # built app -- pull them straight out of the archived Info.plist rather than
          # re-deriving them, so they can never drift from what was actually built.
          APP_PLIST_ENTRY=$(unzip -Z1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -n 1)
          unzip -p "$IPA_PATH" "$APP_PLIST_ENTRY" > "$RUNNER_TEMP/app-info.plist"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_TEMP/app-info.plist")
          BUNDLE_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/app-info.plist")
          echo "Bundle version: $BUNDLE_VERSION ($BUNDLE_SHORT_VERSION)"

          # 1. Create the AuthKey file from the Secret
          mkdir -p ~/.private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/.private_keys/AuthKey_$API_KEY_ID.p8

          # 2. Validate and Upload
          # 'altool' is the standard command line tool for this provided by Xcode.
          # --upload-app is deprecated; --upload-package is its replacement, but it needs the
          # app's numeric App Store Connect "Apple ID" (App Information > General Information)
          # plus the bundle id/version explicitly, since it no longer inspects the ipa itself.
          echo "Uploading to App Store Connect..."
          xcrun altool --upload-package "$IPA_PATH" \
            --type ios \
            --apple-id "$APPLE_ID" \
            --bundle-id "org.centrexcursionistalcoi.app" \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_SHORT_VERSION" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # sentry-cli is installed globally on the self-hosted runner (not per-run like the Android job's
      # ubuntu-latest one below): the installer's default sudo-to-/usr/local/bin install fails in a
      # non-interactive shell ("sudo: a password is required"), and there's no need to reinstall it on every
      # run anyway on a machine that persists between jobs.
      - name: Sentry - Upload iOS Debug Files (dSYMs & Source)
        run: |
          DSYM_PATH="$PWD/build/iosApp.xcarchive/dSYMs"
          
          sentry-cli debug-files upload \
            --include-sources \
            --auth-token ${{ secrets.SENTRY_AUTH_TOKEN }} \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_PROJECT }} \
            "$DSYM_PATH"

      # This runner is self-hosted and persists between jobs, unlike GitHub-hosted runners.
      # "security create-keychain" above adds this job's temp keychain to the user's login
      # keychain search list; without deleting it here, every run leaves behind a dangling
      # entry pointing at a file that $RUNNER_TEMP already cleaned up.
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  sentry-ios:
    name: Release iOS to Sentry
    runs-on: ubuntu-latest

    needs: build-ios

    steps:
      - uses: actions/checkout@v7
      - name: Create Sentry release - iOS
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: app-ios
        with:
          environment: ${{ github.event.release.prerelease && 'beta' || 'production' }}
          version: ${{ github.event.release.name }}

  build-desktop:
    name: Build for Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]

    needs: [shared-tests, app-tests]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      # Refresh the version name again just in case
      - name: Update version name
        run: |
          # The GitHub release name can carry a pre-release suffix (e.g. "2.0.31-rc03") to distinguish it in
          # the GitHub UI/Sentry/etc., but updateVersionName.py (and the Android/iOS version fields it writes)
          # only accepts 1-3 dot-separated integers -- trim anything from the first non-numeric character on.
          VERSION_NAME=$(echo "${{ github.event.release.name }}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}')
          python ./scripts/updateVersionName.py --name="$VERSION_NAME"
      - name: Clean quote backslashes
        id: clean_backslash
        run: bash ./scripts/clean-backslash.sh


      - name: Write local.properties
        run: echo '${{ secrets.LOCAL_PROPERTIES }}' > local.properties

      - name: Import macOS Signing Certificate
        if: runner.os == 'macOS'
        id: macos_signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/macos_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/macos-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')

          # Resolve the exact signing identity string (e.g. "Developer ID Application: Name (TEAMID)")
          # rather than hard-coding it, so a certificate renewal doesn't require touching the workflow.
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate"
            exit 1
          fi
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Build
        env:
          PRODUCTION: true
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: "UQSVPP37UL"
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Notarize DMG
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: "UQSVPP37UL"
        run: |
          # The exact task name has varied across Compose Multiplatform releases
          # (e.g. notarizeDmg vs notarizeReleaseDmg), so resolve it instead of hard-coding it.
          NOTARIZE_TASK=$(./gradlew :composeApp:tasks --all --console=plain 2>/dev/null | grep -oE '^notarize[A-Za-z]*Dmg' | head -1)
          if [ -z "$NOTARIZE_TASK" ]; then
            echo "::error::Could not find a notarize*Dmg Gradle task"
            exit 1
          fi
          echo "Running :composeApp:$NOTARIZE_TASK"
          ./gradlew ":composeApp:$NOTARIZE_TASK"

      - name: Rename deb
        if: startsWith(matrix.os, 'ubuntu')
        run: mv composeApp/build/compose/binaries/main-release/deb/*.deb composeApp/build/compose/binaries/main-release/deb/cea-app_${{ matrix.os }}_amd64.deb

      - name: Rename dmg
        if: runner.os == 'macOS'
        run: mv composeApp/build/compose/binaries/main-release/dmg/*.dmg composeApp/build/compose/binaries/main-release/dmg/cea-app_macos_${{ runner.arch }}.dmg

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            composeApp/build/compose/binaries/main-release/**/*.exe
            composeApp/build/compose/binaries/main-release/**/*.deb
            composeApp/build/compose/binaries/main-release/**/*.dmg

  sentry-desktop:
    name: Release Desktop to Sentry
    runs-on: ubuntu-latest

    needs: build-desktop

    steps:
      - uses: actions/checkout@v7
      - name: Create Sentry release - Desktop
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: app-desktop
        with:
          environment: ${{ github.event.release.prerelease && 'beta' || 'production' }}
          version: ${{ github.event.release.name }}

  server-tests:
    name: Run server tests
    runs-on: ubuntu-latest

    needs: [ update-version-name ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Run Server Tests
        id: server_tests
        run: ./gradlew :server:check

      - name: Upload test results (on failure)
        if: ${{ steps.server_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results
          path: |
            server/build/test-results
            server/build/reports/tests

  release-server:
    name: Build and Publish Server Docker image
    runs-on: ubuntu-latest
    # A GitHub pre-release ("open beta") only affects the mobile/desktop client apps -- it shouldn't also
    # rebuild and push a new :latest server Docker image / redeploy the backend. sentry-server (needs:
    # release-server below) skips automatically along with it.
    if: ${{ !github.event.release.prerelease }}

    needs: [server-tests, shared-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Build and push development
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            arnyminerz/cea-app:latest
            arnyminerz/cea-app:${{ github.event.release.name }}
          file: server/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Update Release description
        # https://img.shields.io/docker/image-size/arnyminerz/cea-app/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: |
            
            [![Docker Hub badge](https://img.shields.io/docker/image-size/arnyminerz/cea-app/${{ github.event.release.name }})](https://hub.docker.com/repository/docker/arnyminerz/cea-app/tags/${{ github.event.release.name }}/)
        run: |
          # Get the release data for this tag
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }} --jq '.id')
          
          # Get current release body
          BODY=$(gh api repos/${{ github.repository }}/releases/$RELEASE_ID --jq '.body')
          
          # Append your suffix
          NEW_BODY="${BODY} <br/>${SUFFIX}"
          
          # Update the release with new body text
          gh api \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/releases/$RELEASE_ID \
            -f body="$NEW_BODY"
  sentry-server:
    name: Release Server to Sentry
    runs-on: ubuntu-latest

    needs: release-server

    steps:
      - uses: actions/checkout@v7
      - name: Create Sentry release - Server
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: server
        with:
          environment: production
          version: ${{ github.event.release.name }}
