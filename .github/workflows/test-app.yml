name: App Tests

on:
  pull_request:
    paths:
      - '.github/workflows/test-app.yml'
      - 'composeApp/**'
      - 'shared/**'
      - '*.gradle.kts'
      - '*.properties'
      - 'gradle/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Run app tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs restore the default-branch cache; only master refreshes it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Copy dummy google-services.json
        run: |
          cp android/google-services.test.json android/google-services.json

      - name: Run App Tests
        id: app_tests
        run: ./gradlew :composeApp:check

      - name: Upload test results (on failure)
        if: ${{ steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          retention-days: 3
          path: |
            composeApp/build/test-results
            composeApp/build/reports/tests

  run_ios_tests:
    name: Run iOS app tests
    # Self-hosted: the same machine development-release.yml/release.yml already use for the TestFlight
    # archive/publish steps. GitHub's hosted macos-26 runners were repeatedly hanging for 15-30+ min on
    # linkDebugTestIosSimulatorArm64 (linking the test binary against the full Firebase/Sentry/GoogleUtilities
    # dependency graph) -- a resource ceiling this box doesn't have. Its disk also stays warm between runs, so
    # there's no need for the explicit ~/.konan/SwiftPM cache steps hosted runners needed.
    #
    # Trade-off: this is a single machine also used by the release workflows, so a PR test run and a release
    # publish now queue behind each other instead of running in parallel the way two hosted runners would.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      SERVER_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs restore the default-branch cache; only master refreshes it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Copy dummy google-services.json
        run: cp android/google-services.test.json android/google-services.json

      - name: Run iOS App Tests
        uses: ./.github/actions/run-ios-tests

      - name: Upload iOS test results (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-test-results
          retention-days: 3
          path: |
            composeApp/build/test-results
            composeApp/build/reports/tests
